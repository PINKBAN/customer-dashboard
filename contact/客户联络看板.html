var lastSync = '';

(function init() {
  if (!currentUser) {
    currentUser = prompt('请输入您的名字：', '');
    if (currentUser) localStorage.setItem('ccc_user', currentUser);
    else currentUser = 'User';
  }
  document.getElementById('currentUserDisplay').textContent = currentUser;
  document.getElementById('currentUserLabel').textContent = '操作人: ' + currentUser;
  // 标题三连击打开操作记录（隐藏功能）
  (function() {
    var clicks = 0, last = 0;
    document.getElementById('mainTitle').onclick = function() {
      var now = Date.now();
      clicks = (now - last < 2000) ? clicks + 1 : 1;
      last = now;
      if (clicks >= 3) { clicks = 0; showHistory(); }
    };
  })();
  // Always render immediately with local data first
  renderTabs();
  renderSummary();
  renderTable();
  // Then try to load from DB in background
  loadStateFromDB(function() {
    renderSummary();
    renderTable();
    startAutoSync();
  });
})();

function startAutoSync() {
  setInterval(function() {
    var active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    loadStateFromDB(function() {
      renderSummary();
      renderTable();
    }, true);
  }, 6000);
}

function loadStateFromDB(callback, silent) {
  if (!SB_URL) {
    if (!silent) console.warn('Supabase未配置，跳过数据库同步');
    setDBStatus(false);
    if (callback) callback();
    return;
  }
  fetch(SB_URL + '/rest/v1/customer_state?select=*&order=updated_at.desc', {
    headers: sbHeaders()
  }).then(function(r) {
    if (!r.ok) {
      if (!silent) console.error('DB load error:', r.status);
      setDBStatus(false);
      if (callback) callback();
      return;
    }
    return r.json();
  }).then(function(rows) {
    if (!rows) return;
    checkedSet.clear();
    reasonMap.clear();
    tradedTodayMap.clear();
    var latest = '';
    rows.forEach(function(row) {
      if (row.checked) checkedSet.set(row.name, true);
      if (row.reason) reasonMap.set(row.name, row.reason);
      if (row.traded_today !== null && row.traded_today !== undefined) tradedTodayMap.set(row.name, row.traded_today);
      if (row.updated_at > latest) latest = row.updated_at;
    });
    lastSync = latest ? new Date(latest).toLocaleString('zh-CN') : '';
    setDBStatus(true);
    if (!silent) updateSyncStatus();
  }).catch(function(e) {
    if (!silent) console.error('DB fetch failed:', e);
    setDBStatus(false);
  }).finally(function() {
    if (callback) callback();
  });
}

function setDBStatus(online) {
  var el = document.getElementById('serverStatus');
  if (online) {
    el.innerHTML = '<span class="status-dot online"></span>数据库已连接';
  } else {
    el.innerHTML = '<span class="status-dot offline"></span>数据库未连接';
  }
}

function updateSyncStatus() {
  document.getElementById('syncStatus').textContent = lastSync ? '最后同步: ' + lastSync : '';
}

function saveToDB(updates, callback) {
  // Use upsert via POST with Prefer: resolution=merge-duplicates
  var rows = [];
  updates.forEach(function(u) {
    rows.push({
      name: u.name,
      checked: u.checked,
      reason: u.reason || '',
      traded_today: u.traded_today !== undefined ? u.traded_today : null,
      updated_by: currentUser,
      updated_at: new Date().toISOString()
    });
  });

  fetch(SB_URL + '/rest/v1/customer_state?on_conflict=name', {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(), {
      'Prefer': 'resolution=merge-duplicates',
      'Content-Type': 'application/json'
    }),
    body: JSON.stringify(rows)
  }).then(function(r) {
    if (r.ok) {
      setDBStatus(true);
      lastSync = new Date().toLocaleString('zh-CN');
      updateSyncStatus();
      if (callback) callback(true);
    } else {
      console.error('DB save error:', r.status);
      setDBStatus(false);
      if (callback) callback(false);
    }
  }).catch(function(e) {
    console.error('DB save failed:', e);
    setDBStatus(false);
    if (callback) callback(false);
  });
}

function refreshFromDB() {
  loadStateFromDB(function() {
    renderSummary();
    renderTable();
    alert('已刷新！最后同步: ' + lastSync);
  });
}

function showHistory() {

  fetch(SB_URL + '/rest/v1/customer_state?select=name,checked,reason,updated_by,updated_at&order=updated_at.desc&limit=50', {
    headers: sbHeaders()
  }).then(function(r) { return r.json(); })
  .then(function(rows) {
    if (!rows || rows.length === 0) {
      content.innerHTML = '<p style="color:#999;">暂无操作记录</p>';
      return;

    var html = '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +

      '<th style="padding:8px;text-align:center;border-bottom:2px solid #e0e0e0;">勾选</th>' +
      '<th style="padding:8px;text-align:left;border-bottom:2px solid #e0e0e0;">不拿货原因</th>' +
      '<th style="padding:8px;text-align:left;border-bottom:2px solid #e0e0e0;">操作人</th>' +
      '<th style="padding:8px;text-align:left;border-bottom:2px solid #e0e0e0;">时间</th></tr>';
    rows.forEach(function(r) {
      var dt = r.updated_at ? new Date(r.updated_at).toLocaleString('zh-CN') : '-';
      var checkedHtml = r.checked ? '<span style="color:#2e7d32;">✓</span>' : '<span style="color:#999;">✗</span>';
      html += '<tr style="border-bottom:1px solid #f0f0f0;">' +
        '<td style="padding:6px 8px;">' + (r.name || '').replace(/</g, '&lt;') + '</td>' +
        '<td style="padding:6px 8px;text-align:center;">' + checkedHtml + '</td>' +
        '<td style="padding:6px 8px;">' + (r.reason || '-') + '</td>' +
        '<td style="padding:6px 8px;">' + (r.updated_by || '-') + '</td>' +
        '<td style="padding:6px 8px;color:#888;">' + dt + '</td></tr>';
    });
    html += '</table>';
    content.innerHTML = html;
  }).catch(function(e) {
    content.innerHTML = '<p style="color:#e53935;">加载失败: ' + e.message + '</p>';
  });
}

function saveAll() {
  // Save ALL checked and reason state
  var updates = [];
  var allNames = new Set();
  checkedSet.forEach(function(v, k) { allNames.add(k); });
  reasonMap.forEach(function(v, k) { allNames.add(k); });
  allNames.forEach(function(name) {
    updates.push({
      name: name,
      checked: checkedSet.has(name),
      reason: reasonMap.get(name) || '',
      traded_today: tradedTodayMap.has(name) ? tradedTodayMap.get(name) : null
    });
  });
  if (updates.length === 0) { alert('没有需要保存的数据'); return; }
  saveToDB(updates, function(ok) {
    if (ok) alert('已保存 ' + updates.length + ' 条记录到数据库！');
    else alert('保存失败，请检查网络连接');
  });
}

function urgencyRank(u) {
  if (u === 'urgent') return 0;
  if (u === 'overdue') return 1;
  if (u === 'soon') return 2;
  if (u === 'upcoming') return 3;
  if (u === 'normal') return 4;
  return 5;
}

function getFilteredData() {
  var list = FULL_DATA.slice();
  if (currentManager !== '全部') {
    list = list.filter(function(d) { return d.manager === currentManager; });
  }
  var search = document.getElementById('searchInput').value.trim().toLowerCase();
  if (search) {
    list = list.filter(function(d) { return d.name.toLowerCase().indexOf(search) !== -1 || d.contact.toLowerCase().indexOf(search) !== -1; });
  }
  var ur = document.getElementById('filterUrgency').value;
  if (ur === 'checked') list = list.filter(function(d) { return tradedTodayMap.has(d.name) || reasonMap.has(d.name); });
  else if (ur === 'unchecked') list = list.filter(function(d) { return !tradedTodayMap.has(d.name) && !reasonMap.has(d.name); });
  else if (ur !== 'all') list = list.filter(function(d) { return d.cycleUrgency === ur; });
  if (currentCustomFilter === 'hasCycle') {
    list = list.filter(function(d) { return d.hasCycle; });
  }
  var rec = document.getElementById('filterReceivable').value;
  if (rec === 'has') list = list.filter(function(d) { return d.receivable > 0; });
  else if (rec === 'none') list = list.filter(function(d) { return d.receivable <= 0; });
  var reg = document.getElementById('filterRegularity').value;
  if (reg === 'high') list = list.filter(function(d) { return d.regularity > 0.7; });
  else if (reg === 'mid') list = list.filter(function(d) { return d.regularity >= 0.3 && d.regularity <= 0.7; });
  else if (reg === 'low') list = list.filter(function(d) { return d.regularity > 0 && d.regularity < 0.3; });
  return list;
}

}

function renderTabs() {
  var html = '<div class="tab' + (currentManager === '全部' ? ' active' : '') + '" onclick="switchManager(&quot;全部&quot;)">全部<span class="badge">' + FULL_DATA.length + '</span></div>';
  MANAGERS.forEach(function(mgr) {
    var md = FULL_DATA.filter(function(d) { return d.manager === mgr; });
    var urg = md.filter(function(d) { return d.cycleUrgency === 'urgent'; }).length;
    var sn = md.filter(function(d) { return d.cycleUrgency === 'soon'; }).length;
    html += '<div class="tab' + (currentManager === mgr ? ' active' : '') + '" onclick="switchManager(&quot;' + mgr + '&quot;)">' + mgr + '<span class="badge">' + urg + '</span><span class="badge-soon">' + sn + '</span></div>';
  });
  document.getElementById('tabs').innerHTML = html;
}

function switchManager(mgr) {
  currentManager = mgr;
  document.getElementById('selectAll').checked = false;
  renderTabs();
  renderSummary();
  renderTable();
}

function toggleAll(cb) {
  var list = getFilteredData();
  list.forEach(function(d) { if (cb.checked) checkedSet.set(d.name, true); else checkedSet.delete(d.name); });
  saveChecked(d.name); // trigger save for the first one to persist
  renderTable();
}

function toggleCheck(name) {
  var was = checkedSet.has(name);
  if (was) checkedSet.delete(name); else checkedSet.set(name, true);
  saveToDB([{ name: name, checked: !was, reason: reasonMap.get(name) || '', traded_today: tradedTodayMap.has(name) ? tradedTodayMap.get(name) : null }]);
  renderSummary();
}

function sortTable(field) {
  if (currentSort.field === field) currentSort.asc = !currentSort.asc;
  else { currentSort.field = field; currentSort.asc = (field === 'cycleUrgency' || field === 'noTradeDays') ? false : true; }
  renderTable();
}

function getProductSummaryHtml(summary) {
  if (!summary || !summary.length) return '<span style="color:#ccc;">-</span>';
  return summary.slice(0, 5).map(function(s) {
    var cls = s.regularity > 0.7 ? 'high-reg' : (s.regularity >= 0.3 ? 'mid-reg' : 'low-reg');
    return '<div title="' + s.brand.replace(/"/g, '&quot;') + ': ' + s.cycleDays + '天, 规律' + (s.regularity*100).toFixed(0) + '%, 采购' + s.count + '次, 最近' + s.lastDate + '" style="white-space:nowrap;"><span class="' + cls + '" style="font-size:10px;">' + s.brand.replace(/</g, '&lt;') + '</span> <span style="font-size:10px;">' + s.cycleDays + '天</span></div>';
  }).join('');
}

function renderTable() {
  var list = getFilteredData();
  var field = currentSort.field;
  var asc = currentSort.asc;

  if (field === 'cycleUrgency') {
    list.sort(function(a, b) {
      var cmp = urgencyRank(a.cycleUrgency) - urgencyRank(b.cycleUrgency);
      if (cmp === 0) cmp = (b.noTradeDays || 0) - (a.noTradeDays || 0);
      return asc ? cmp : -cmp;
    });
  } else {
    list.sort(function(a, b) {
      var va = a[field], vb = b[field];
      if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); return asc ? (va < vb ? -1 : va > vb ? 1 : 0) : (vb < va ? -1 : vb > va ? 1 : 0); }
      return asc ? va - vb : vb - va;
    });
  }

  var html = '';
  for (var i = 0; i < list.length; i++) {
    var d = list[i];
    var checked = checkedSet.has(d.name);
    var reason = reasonMap.get(d.name) || '';
    var tradedToday = tradedTodayMap.has(d.name) ? tradedTodayMap.get(d.name) : null;
    var rowClass = 'row-' + d.cycleUrgency;
    if (checked) rowClass += ' edited';
    if (reason) rowClass += ' edited';

    var badgeHtml = '';
    if (d.cycleUrgency === 'urgent') badgeHtml = '<span class="badge-urgent">立即联系</span>';
    else if (d.cycleUrgency === 'overdue') badgeHtml = '<span class="badge-overdue">建议联系</span>';
    else if (d.cycleUrgency === 'soon') badgeHtml = '<span class="badge-soon">提前联系</span>';
    else if (d.cycleUrgency === 'upcoming') badgeHtml = '<span class="badge-upcoming">可关注</span>';
    else if (!d.hasCycle && d.noTradeDays < 7) badgeHtml = '<span class="badge-no">无周期数据</span>';

    var cycleHtml = d.hasCycle ? ('<strong>' + d.cycleDays + '</strong> 天') : '<span style="color:#999;">-</span>';

    var regHtml = '-';
    if (d.hasCycle) {
      if (d.regularity > 0.7) regHtml = '<span class="high-reg">高 (' + d.regularity.toFixed(1) + ')</span>';
      else if (d.regularity >= 0.3) regHtml = '<span class="mid-reg">中 (' + d.regularity.toFixed(1) + ')</span>';
      else regHtml = '<span class="low-reg">低 (' + d.regularity.toFixed(1) + ')</span>';
    }

    var suggClass = 'suggestion-cell ';
    if (d.cycleUrgency === 'urgent') suggClass += 'urgent-text';
    else if (d.cycleUrgency === 'overdue') suggClass += 'overdue-text';
    else if (d.cycleUrgency === 'soon') suggClass += 'soon-text';
    else if (d.cycleUrgency === 'upcoming') suggClass += 'upcoming-text';
    else suggClass += 'normal-text';

    var tagList = d.tags ? d.tags.split(',').filter(function(t) { return t.trim(); }).slice(0, 3) : [];
    var tagHtml = tagList.map(function(t) { return '<span class="tag">' + t.trim().replace(/</g, '&lt;') + '</span>'; }).join('');
    var contactHtml = (d.contact || '-').replace(/(\d{11})/g, '<br><span class="phone">$1</span>');
    var dateDisplay = d.hasCycle ? d.cycleLastDate : (d.lastTradeDate || '-');
    var daysStyle = d.noTradeDays >= 30 ? 'color:#e53935;' : (d.noTradeDays >= 15 ? 'color:#ef6c00;' : '');

    var nameEsc = d.name.replace(/'/g, "&#39;");
    var reasonEsc = reason.replace(/"/g, '&quot;');

    html += '<tr class="' + rowClass + '">' +
      '<td><input type="checkbox" class="checkbox"' + (checked ? ' checked' : '') + ' onchange="toggleCheck(\'' + nameEsc + '\')"></td>' +
      '<td><strong>' + d.name.replace(/</g, '&lt;') + '</strong>' + (badgeHtml ? '<br>' + badgeHtml : '') + '</td>' +
      '<td style="font-size:12px;">' + d.manager + '</td>' +
      '<td style="text-align:center;">' + cycleHtml + '</td>' +
      '<td style="text-align:center;font-size:12px;">' + regHtml + '</td>' +
      '<td style="font-size:12px;">' + dateDisplay + '</td>' +
      '<td style="text-align:center;font-weight:600;' + daysStyle + '">' + d.noTradeDays + '天</td>' +
      '<td class="amount' + (d.receivable < 0 ? ' negative' : '') + '">' + (d.receivable ? d.receivable.toLocaleString('zh-CN', {maximumFractionDigits:0}) : '0') + '</td>' +
      '<td class="amount">' + (d.monthAmount ? d.monthAmount.toLocaleString('zh-CN', {maximumFractionDigits:0}) : '0') + '</td>' +
      '<td style="font-size:11px;">' + contactHtml + '</td>' +
      '<td style="max-width:100px;font-size:10px;">' + (tagHtml || '-') + '</td>' +
      '<td><div class="' + suggClass + '">' + d.suggestion + '</div></td>' +
      '<td style="font-size:10px;max-width:120px;line-height:1.3;">' + getProductSummaryHtml(d.productSummary) + '</td>' +
      '<td><select style="width:auto;min-width:60px;padding:4px 8px;border:1px solid #e0e0e0;border-radius:4px;font-size:12px;" onchange="updateTradedToday(\'' + nameEsc + '\', this.value)" onclick="event.stopPropagation()"><option value="">-</option><option value="yes"' + (tradedToday === true ? ' selected' : '') + '>是</option><option value="no"' + (tradedToday === false ? ' selected' : '') + '>否</option></select></td>' +
      '<td><input type="text" class="reason-input" placeholder="输入原因..." value="' + reasonEsc + '" onchange="updateReason(\'' + nameEsc + '\', this.value)" onclick="event.stopPropagation()"></td>' +
      '</tr>';
  }

  if (list.length === 0) {
    html = '<tr><td colspan="14" style="text-align:center;padding:40px;color:#999;">没有匹配的客户记录</td></tr>';
  }

  document.getElementById('tableBody').innerHTML = html;
  document.getElementById('statsBar').innerHTML = '显示 <strong>' + list.length + '</strong> 条';
  var twc = FULL_DATA.filter(function(d){return d.hasCycle;}).length;
  document.getElementById('footerInfo').innerHTML = '共 <strong>' + FULL_DATA.length + '</strong> 位 · 有周期 <strong>' + twc + '</strong> 位 · 已勾选 <strong>' + checkedSet.size + '</strong> 位 · 已填原因 <strong>' + reasonMap.size + '</strong> 位 · 今日已交易 <strong>' + Array.from(tradedTodayMap.values()).filter(function(v){return v===true;}).length + '</strong> 位';
}

function updateReason(name, value) {
  if (value.trim()) reasonMap.set(name, value.trim());
  else reasonMap.delete(name);
  saveToDB([{ name: name, checked: checkedSet.has(name), reason: value.trim(), traded_today: tradedTodayMap.has(name) ? tradedTodayMap.get(name) : null }]);
}

function updateTradedToday(name, value) {
  if (value === 'yes') tradedTodayMap.set(name, true);
  else if (value === 'no') tradedTodayMap.set(name, false);
  else tradedTodayMap.delete(name);
  saveToDB([{ name: name, checked: checkedSet.has(name), reason: reasonMap.get(name) || '', traded_today: value === 'yes' ? true : (value === 'no' ? false : null) }]);
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterUrgency').value = 'all';
  document.getElementById('filterReceivable').value = 'all';
  document.getElementById('filterRegularity').value = 'all';
  document.getElementById('selectAll').checked = false;
  renderTable();
}

function exportData() {
  var list = getFilteredData();
  var rows = [['客户名称','分管人员','拿货周期(天)','规律性','上次拿货','距上次(天)','应收金额','本月交易额','联系方式','标签','联系建议','今日交易','不拿货原因','已勾选']];
  list.forEach(function(d) {
    rows.push([d.name, d.manager, d.hasCycle ? d.cycleDays : '-', d.hasCycle ? d.regularity : '-',
      d.hasCycle ? d.cycleLastDate : d.lastTradeDate, d.noTradeDays, d.receivable, d.monthAmount,
      d.contact, d.tags, d.suggestion, tradedTodayMap.get(d.name) === true ? '是' : (tradedTodayMap.get(d.name) === false ? '否' : '-'), reasonMap.get(d.name) || '', checkedSet.has(d.name) ? '是' : '否']);
  });
  var lines = rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); });
  var csv = lines.join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '客户联络_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function openBatchModal() { document.getElementById('batchReasonModal').classList.add('show'); }
function closeModal() { document.getElementById('batchReasonModal').classList.remove('show'); }
function applyBatchReason() {
  var reason = document.getElementById('batchReason').value.trim();
  if (!reason) { alert('请输入原因'); return; }
  var updates = [];
  var list = getFilteredData();
  var count = 0;
  list.forEach(function(d) {
    if (checkedSet.has(d.name)) {
      reasonMap.set(d.name, reason);
      updates.push({ name: d.name, checked: true, reason: reason });
      count++;
    }
  });
  if (updates.length === 0) { alert('请先勾选需要填写原因的客户'); return; }
  saveToDB(updates, function(ok) {
    closeModal();
    document.getElementById('batchReason').value = '';
    renderTable();
    alert('已为 ' + count + ' 位客户填写原因' + (ok ? '' : '（但保存失败）'));
  });
}
</script>
</body>
</html>
